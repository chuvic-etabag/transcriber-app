# Sends the Edge Functions in supabase/functions/ to Supabase.
# It only runs when you start it by hand: Actions > Deploy Edge Functions > Run workflow.
#
# Needs two repository secrets (Settings > Secrets and variables > Actions):
#   SUPABASE_ACCESS_TOKEN  a personal access token from https://supabase.com/dashboard/account/tokens
#   SUPABASE_PROJECT_REF   the project reference, mgiwopbaglgzxeaowzzt
name: Deploy Edge Functions

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-edge-functions
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Edge Functions
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Check The Secrets Are There
        run: |
          missing=0
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "::error::The secret SUPABASE_ACCESS_TOKEN is missing. Add it under Settings > Secrets and variables > Actions."; missing=1; fi
          if [ -z "$SUPABASE_PROJECT_REF" ]; then echo "::error::The secret SUPABASE_PROJECT_REF is missing. Add it under Settings > Secrets and variables > Actions."; missing=1; fi
          exit $missing

      - name: Get The Code
        uses: actions/checkout@v4

      - name: Install The Supabase Command Line Tool
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy The Functions
        working-directory: .
        run: |
          set -e
          for fn in check-limit start-job job-status job-result delete-audio; do
            echo "Deploying $fn"
            supabase functions deploy "$fn" --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt --yes
          done

      - name: List What Is Deployed
        run: supabase functions list --project-ref "$SUPABASE_PROJECT_REF"
